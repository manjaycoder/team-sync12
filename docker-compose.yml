version: '3.8'

services:
  # ==========================================
  # MongoDB 7.0 Database Container
  # ==========================================
  mongodb:
    image: mongo:7.0
    container_name: teamsync-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: team-sync
    volumes:
      - mongodb_data:/data/db
    networks:
      - teamsync-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Java 21 Spring Boot 3 Backend
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teamsync-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      SPRING_PROFILES_ACTIVE: prod
      MONGO_URI: mongodb://mongodb:27017/team-sync
      JWT_SECRET: teamsync_jwt_super_secret_key_2026_production_ready_enterprise_level_hmac256_key
      JWT_EXPIRATION_MS: 604800000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AUTO_SEED: "true"
      FRONTEND_URL: "http://localhost:5173,https://manjaycoder.vercel.app"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - teamsync-network

  # ==========================================
  # Prometheus Metrics Collector
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: teamsync-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - teamsync-network
    depends_on:
      - backend

  # ==========================================
  # Grafana Monitoring Dashboard
  # ==========================================
  grafana:
    image: grafana/grafana:11.1.0
    container_name: teamsync-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - teamsync-network
    depends_on:
      - prometheus

volumes:
  mongodb_data:
  prometheus_data:
  grafana_data:

networks:
  teamsync-network:
    driver: bridge
