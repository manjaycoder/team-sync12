apiVersion: apps/v1
kind: Deployment
metadata:
  name: teamsync-backend
  namespace: teamsync
  labels:
    app: teamsync-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: teamsync-backend
  template:
    metadata:
      labels:
        app: teamsync-backend
    spec:
      containers:
        - name: backend
          image: teamsync-backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
              name: http
          envFrom:
            - configMapRef:
                name: teamsync-config
            - secretRef:
                name: teamsync-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 5001
            initialDelaySeconds: 40
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 5001
            initialDelaySeconds: 25
            periodSeconds: 10
