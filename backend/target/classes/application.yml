server:
  port: ${PORT:5001}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

spring:
  application:
    name: teamsync-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/team-sync}
      auto-index-creation: true
  main:
    banner-mode: console

# TeamSync Custom Properties
teamsync:
  jwt:
    # Must be at least 256 bits (32 bytes) for HMAC-SHA256
    secret: ${JWT_SECRET:teamsync_jwt_super_secret_key_2026_production_ready_enterprise_level_hmac256_key}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000} # 7 days
    refresh-expiration-ms: ${REFRESH_TOKEN_EXPIRATION_MS:2592000000} # 30 days
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
  cors:
    allowed-origins:
      - ${FRONTEND_URL:http://localhost:5173}
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:3000
      - http://localhost:5001
      - https://manjaycoder.vercel.app
  auto-seed: ${AUTO_SEED:true}

# Actuator & Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true

# Structured Logging
logging:
  level:
    root: INFO
    com.teamsync: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

