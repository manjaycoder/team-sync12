# Render Blueprint Infrastructure Specification
# Java 21 + Spring Boot 3 Modular Monolith Deployment
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: team-sync
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 5001
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://manjaycoder.vercel.app
