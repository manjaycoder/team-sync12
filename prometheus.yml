global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "teamsync-backend"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["backend:5001"]
        labels:
          application: "teamsync-backend"
          environment: "production"
